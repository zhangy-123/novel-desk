[package]
name = "novel-desk"
version = "0.1.0"
description = "本地优先的双端写作工具（对标橙瓜码字的 MVP）"
authors = ["you"]
edition = "2021"

[lib]
name = "novel_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[profile.release]
# 减小产物体积
codegen-units = 1
lto = true
opt-level = "s"
strip = true
